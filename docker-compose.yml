# Lancement du portail BDDMAS : docker compose up --build
# puis ouvrir http://localhost:5000
services:
  portail:
    build: .
    image: bddmas-portail
    container_name: bddmas-portail
    ports:
      - "5000:5000"
    # Clé API et réglages IA lus depuis .env (facultatif, voir .env.exemple)
    env_file:
      - path: .env
        required: false
    # Dossiers partagés avec le PC : les fichiers Insee déposés, les métadonnées
    # produites par le transformer, le cache des colonnes auto et les millésimes
    # validés restent hors du conteneur ; un dictionnaire modifié sur le PC est
    # pris en compte sans reconstruire l'image
    volumes:
      - ./data:/app/data
      - ./dictionnaires:/app/dictionnaires
    restart: unless-stopped
