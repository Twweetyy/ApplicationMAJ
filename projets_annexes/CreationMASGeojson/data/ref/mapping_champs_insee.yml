# Correspondance champ_insee_N (schéma stat_insee_iris2) -> source dans TAB_BDDMAS_Tout_perimetre_<ANNEE>.xlsx
#
# Trois façons de remplir un champ :
#   src:  [ONGLET, "Nom de colonne"]  -> ONGLET = préfixe du nom d'onglet SANS l'année (POP, LOG, ACT RES...),
#                                        ainsi le fichier reste valable pour 2024, 2025...
#                                        Les accents / apostrophes typographiques sont ignorés à la comparaison.
#   yml:  fichier.yml                 -> valeur lue dans un YAML {LIBELLE IRIS: valeur} de data/ref
#   expr: "champ_insee_27 / champ_insee_24 * 100"  -> calcul à partir d'autres champs (évalué après src/yml)
#   na:   "raison"                    -> indicateur non disponible dans le millésime : laissé vide
#   supprimer: "raison"               -> champ retiré de toutes les sorties (année, historique, GeoJSON)
#
# Option sur toute ligne :
#   libelle: "..."                    -> remplace le libellé du modèle stat_insee_iris2 (ex. découpage Insee modifié).
# Un champ absent du modèle (ex. champ_insee_168) est ajouté en fin de table ; vide pour les années passées.
#
# Pour un nouveau millésime : vérifier seulement les lignes dont le nom de colonne INSEE a changé.

# --- Population -------------------------------------------------------------
# Depuis le RP 2023, l'Insee publie les âges en 0-2, 3-5, 6-10, 11-17, 18-24, 25-39, 40-54, 55-64, 65-79, 80+
# (et 15-24, 0-19, 65+). Les champs 9 à 13 et 15 suivent ce découpage ; le libellé rappelle l'ancien.
# 55-64 ans, nouvelle tranche, est en champ_insee_168 (fin de table).
champ_insee_2:   {src: [POP, "Population"]}
champ_insee_3:   {yml: variable_population_2006.yml}
champ_insee_4:   {expr: "champ_insee_2 - champ_insee_3"}
champ_insee_5:   {expr: "champ_insee_4 / champ_insee_3 * 100"}
champ_insee_6:   {yml: variable_population_2011.yml}
champ_insee_7:   {yml: variable_population_2016.yml}
champ_insee_8:   {src: [POP, "Pop 0-14 ans"]}
champ_insee_9:   {src: [POP, "Pop 15-24 ans"], libelle: "Population entre 15 et 24 ans (15-29 ans jusqu'en 2022)"}
champ_insee_10:  {src: [POP, "Pop 25-39 ans"], libelle: "Population entre 25 et 39 ans (30-44 ans jusqu'en 2022)"}
champ_insee_11:  {src: [POP, "Pop 40-54 ans"], libelle: "Population entre 40 et 54 ans (45-59 ans jusqu'en 2022)"}
champ_insee_12:  {src: [POP, "Pop 65-79 ans"], libelle: "Population entre 65 et 79 ans (60-74 ans jusqu'en 2022)"}
champ_insee_13:  {src: [POP, "Pop 80 ans ou plus"], libelle: "Population de 80 ans et plus (75 ans et plus jusqu'en 2022)"}
champ_insee_14:  {src: [POP, "Part de la population de moins de 20 ans (%) parmi la population iris"]}
champ_insee_15:  {expr: "(champ_insee_12 + champ_insee_13) / champ_insee_2 * 100", libelle: "Part de la population de 65 ans et plus (%) (60 ans et plus jusqu'en 2022)"}
champ_insee_16:  {src: [POP, "Pop 15 ans ou plus Agriculteurs exploitants"]}
