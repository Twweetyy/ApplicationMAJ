POP: Données infra-communales - Population
ACT RES: Données infra-communales - Activité des résidents
COU FAM: Données infra-communales - Couples - Familles - Ménages
DIP FORMATION: Données infra-communales - Diplômes - Formation
LOG: Données infra-communales - Logement
REV DEC: Indicateurs de distribution des revenus déclarés des ménages par unité de consommation
REV DISP: Indicateurs de distribution des revenus disponibles des ménages par unité de consommation
CAF: Bénéficiaires des prestations légales versées par les CAF
CNAM: Bénéficiaires du régime général de l’assurance maladie, dont bénéficiaires de la complémentaire santé solidaire
DEFM: Demandeurs d'emploi au 31 décembre (données annuelles)
RPLS: Répertoire du Parc Locatif Social (RPLS)
PETITE ENFANCE: Répartition pondérée des enfants par âge révolu et par IRIS
PETITE ENFANCE MILLÉSIME: Répartition pondérée des enfants par âge au 31 décembre et par IRIS